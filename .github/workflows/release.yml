# Tag push → BigWigs Packager → CurseForge Upload API.
# Do NOT use a GitHub→CurseForge webhook for this; CF_API_KEY uploads outbound.
# See docs/CURSEFORGE.md § "GitHub → CurseForge automation".
name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Require CurseForge project id
        run: |
          id="$(grep -E '^## X-Curse-Project-ID:' SnapPostForever.toc | awk '{print $3}')"
          echo "X-Curse-Project-ID=${id}"
          if [[ -z "${id}" || ! "${id}" =~ ^[0-9]+$ ]]; then
            echo "TOC X-Curse-Project-ID must be digits only (got: '${id}')" >&2
            exit 1
          fi

      - name: Require versions to match the tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          want="${GITHUB_REF_NAME#v}"
          toc="$(grep -E '^## Version:' SnapPostForever.toc | awk '{print $3}')"
          core="$(sed -nE 's/^ns\.version = "([^"]+)".*/\1/p' Core.lua)"
          echo "tag=${want} toc=${toc} core=${core}"
          if [[ "${toc}" != "${want}" || "${core}" != "${want}" ]]; then
            echo "Bump ## Version in SnapPostForever.toc and ns.version in Core.lua to ${want} before tagging." >&2
            exit 1
          fi

      - name: Package and upload
        uses: BigWigsMods/packager@v2
        env:
          CF_API_KEY: ${{ secrets.CF_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

