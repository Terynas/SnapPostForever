# Tag push → BigWigs Packager → CurseForge Upload API.
# Do NOT use a GitHub→CurseForge webhook for this; CF_API_KEY uploads outbound.
# See docs/CURSEFORGE.md § "GitHub → CurseForge automation".
name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Require CurseForge project id
        run: |
          id="$(grep -E '^## X-Curse-Project-ID:' SnapPostForever.toc | awk '{print $3}')"
          echo "X-Curse-Project-ID=${id}"
          if [[ -z "${id}" || ! "${id}" =~ ^[0-9]+$ ]]; then
            echo "TOC X-Curse-Project-ID must be digits only (got: '${id}')" >&2
            exit 1
          fi

      - name: Require TOC version to come from the tag
        run: |
          toc="$(grep -E '^## Version:' SnapPostForever.toc | awk '{print $3}')"
          if [[ "${toc}" != "@project-version@" ]]; then
            echo "SnapPostForever.toc must use '## Version: @project-version@' (got: '${toc}')" >&2
            exit 1
          fi

      - name: Package and upload
        uses: BigWigsMods/packager@v2
        env:
          CF_API_KEY: ${{ secrets.CF_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

